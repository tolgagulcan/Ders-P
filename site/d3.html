*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}

.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:13px;color:var(--muted)}

h2{margin:4px 0 8px;font-size:22px}

.ozu p{margin:0}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}

th{background:var(--chip)}
ol.ders{list-style:none;padding:0;margin:0}

.need{margin:0}
details{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
details ul{margin:8px 0 0;padding-left:18px}
details li{margin:3px 0}
a{color:var(--link)}
.pdf{display:inline-block;margin-top:16px;background:#1d3a5c;color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{color:var(--muted);font-size:13px;text-align:center;padding:0 16px 32px}

{ay:"Ekim",brans:"Matematik",ad:"Çemberden Üçgene",sinif:5,sure:5,kod:"MAT.5.3.7",
 pdf:PDF("6943de1aa54808.45676203"),
 ozet:"Öğrenciler, kesişen iki çemberin merkezlerinden ve bir kesişim noktasından eşkenar, ikizkenar ve çeşitkenar üçgen oluşturmayı keşfeder.",
 ozu:`<p>İki çember iki noktada kesiştiğinde, iki merkez ve kesişim noktalarından biri birleştirilince bir üçgen oluşur. Kenarlar yarıçaplara eşittir; üçgenin türü çemberlerin nasıl çizildiğine bağlıdır. Böylece cetvelle ölçmeden, sadece pergelle istenen türde üçgen çizilebilir.</p>
 <table><tr><th>Çemberler</th><th>Oluşan üçgen</th></tr>
 <tr><td>Yarıçaplar eşit, biri diğerinin merkezinden geçiyor</td><td><b>Eşkenar</b></td></tr>
 <tr><td>Yarıçaplar eşit, merkezlerden geçmiyor</td><td><b>İkizkenar</b></td></tr>
 <tr><td>Yarıçaplar farklı, biri diğerinin merkezinden geçiyor</td><td><b>İkizkenar</b></td></tr>
 <tr><td>Yarıçaplar farklı, merkezlerden geçmiyor</td><td><b>Çeşitkenar</b></td></tr></table>`,
 dersler:[
 ["Çemberle ısınma","Sınıf 6–7 kişilik gruplara ayrılır, her grup bahçede el ele tutuşup çember olur. Önce kelime zinciri oynanır: her öğrenci bir öncekinin son harfiyle yeni kelime söyler. Öğretmen sorar: “Kelimeden yeni kelimeler türettik; bir şekilden yeni şekiller türetebilir miyiz?” İki grup kesişen iki çember kurar, öğrenciler bu yapıdan hangi şekillerin çıkabileceğini tartışır."],
 ["Çemberli logolar","Akıllı tahtada çemberlerle yapılmış marka logoları gösterilir; çemberin bayraklardan otomobil tasarımına kadar her yerde kullanıldığı anlatılır. Her öğrenci çevrim içi bir logo aracıyla çemberlerden kendi logosunu tasarlar, logolar tahtada birlikte incelenir."],
 ["GeoGebra'da keşif","“Her türlü üçgen çemberlerle çizilebilir mi?” sorusuna öğrenciler Evet/Hayır deyip gerekçe söyler. Öğretmen dinamik geometri aracında 4 adımı gösterir: birinci çemberi çiz → onu kesen ikinci çemberi çiz → kesişim noktalarını işaretle → iki merkez ve bir kesişim noktasıyla üçgen oluştur. 4'erli gruplarda her öğrenci bir adımı yapar, grup üçgenin türünü tahmin eder; öğretmen kenar uzunluklarını göstererek kontrol eder. Yukarıdaki tablonun doldurulduğu etkinlik kâğıdıyla biter."],
 ["“Bu Üçgen Kimin?” istasyon etkinliği","Sınıfta Eşkenar, İkizkenar ve Çeşitkenar adlı üç masa kurulur. Gruplar kendi masasındaki üçgeni pergel ve cetvelle çizmeye başlar; 5 dakikada bir masa değiştirip bir önceki grubun yarım bıraktığı çizimi tamamlar. Herkes başladığı masaya dönünce biter. Öğrenciler öz değerlendirme formunu doldurur."],
 ["Değerlendirme","Wordwall'da 7 soruluk test (doğru-yanlış, çoktan seçmeli, çevre hesabı) yapılır; sonuçlar sınıfla incelenir, yanlışlar tahtada çözülür. Ders sonrası EBA'dan 4 soruluk ödev gönderilir."]],
 gerek:"Akıllı tahta, bilgisayar, pergel, ölçüsüz cetvel, kareli A4 kâğıt",
 link:[["Kesişen Çember Logoları","Nxbro8"],["Çemberlerden Üçgen Oluşturma Örneği","Be1NMG"],["Kesişen Çemberler ile Üçgen Oluşturma (Wordwall testi)","UYKeTXP"]]},

{ay:"Ekim",brans:"Matematik",ad:"Devirli Ondalıkların PISA Macerası",sinif:6,sure:5,kod:"MAT.6.1.6",
 pdf:PDF("69e0bd01d6a496.56801738"),
 ozet:"PISA sorularından yola çıkarak kesrin aslında bir bölme işlemi olduğu keşfedilir; kesirler ondalık gösterime çevrilir, devirli ondalık gösterim öğrenilir ve yapay zekâ destekli bir araçla kesir hesap makinesi yapılır.",
 ozu:`<p>Bir kesrin payı paydasına bölünerek ondalık gösterim bulunur. Paydası 10, 100, 1000'e genişletilebilen kesirlerin ondalık kısmı sonludur (7/4 = 1,75). Genişletilemeyenlerde ondalık kısım sürekli tekrar eder ve tekrar eden rakamların üstüne çizgi konur (1/3 = 0,333… = 0,3̅).</p>`,
 dersler:[
 ["PISA ile tanışma, kesir = bölme","Öğretmen ulusal ve uluslararası sınavları (TIMSS, PISA, ICILS) sorar, PISA 2022'nin Güneş Sistemi sorusunu tahtada birlikte çözer. Tahtaya 5/2 yazar: “Neden ‘beş bölü iki’ diyoruz?” İkişerli vızıltı gruplarında 3 dk tartışılır. EBA videolarıyla kesir–bölme ilişkisi ve ondalık gösterim izlenir; 7/4 tahtada bölünüp hesap makinesiyle kontrol edilir. “Kesirler Aslında Birer Bölme” etkinliği yapılır. Ödev: PISA hakkında araştırma ve açıklanan soruları inceleme."],
 ["PISA benzeri problemler","“Bardağımı Ver” çalışma kâğıdı bireysel çözülür, gönüllüler tahtada çözer. Ardından Musluk Problemi: 3 m'lik duvara eşit aralıklı 7 musluk takılacak, aradaki mesafe kaç m? Öğrenciler çözüp musluk konumlarını tahtadaki etkileşimli etkinlikte yerleştirir."],
 ["Yapay zekâ ile kesir hesaplayıcı","Öğrenciler yapay zekâ destekli bir kodlama aracına girip yönergedeki adımlarla kesri ondalık gösterime çeviren “Kesir Hesaplayıcısı” yapar. 5/8 hem tahtada bölünerek hem hesaplayıcıyla bulunup karşılaştırılır. “Problemi Çöz Ondalığı Sırala” etkinliğiyle problemler çözülüp sonuçlar sıralanır. (Not: Öğrenci hesaplarında yapay zekâ izni kapalıysa “Ayarlar”dan açılmalı.)"],
 ["Hazine Haritası: devirli ondalık","3–4 kişilik gruplar “Hazine Haritası” oyununda 1 kg altını farklı sayıda kişiye paylaştırır. 1 kg'ı 3 kişiye bölünce sonuca ulaşamazlar; neden zorlandıklarını tartışırlar. EBA'dan Devirli Ondalık Gösterim videosu izlenir, 1÷3 = 0,3̅ tahtada gösterilir. 10 kg/9 kişi sorusu çözülür, sonlu ve devirli ondalık farkı genellenir. Eşleştirme etkinliğiyle pekiştirilir."],
 ["Kavram haritası ve Kesir Hesap Makinesi","“Kavramlar Yerli Yerinde” kavram haritası tamamlanır. Önceki hesaplayıcı geliştirilerek devirli ondalığı da gösteren “Kesir Hesap Makinesi” yapılır; 7/6 tahtada ve makinede karşılaştırılır. “Efe'nin Odası” çoktan seçmeli problemleriyle ders biter."]],
 gerek:"Akıllı tahta, öğrenci bilgisayarları, sınıf yönetim aracı (EBA vb.), Bardağımı Ver çalışma kâğıdı çıktısı",
 link:[["PISA Güneş Sistemi Sorusu","UVUb6JI"],["EBA Bölme İşlemi ile Kesir Arasındaki İlişki","U8uxuYN"],["EBA Ondalık Gösterimler","07ebhx"],["Kesirler Aslında Birer Bölme","UfmJ876"],["PISA 2022 Açıklanan Matematik Soruları","wmXxuH"],["Musluk Problemi","UKLiPNn"],["Muslukların Konumlarını Belirle","UDQ2FVu"],["Yapay Zekâ Aracı","NeP5Oj"],["Kesir Hesaplayıcısı","U5JbUCY"],["Problemi Çöz Ondalığı Sırala","Uq9jqA3"],["Hazine Haritası","MOlMFY"],["EBA Devirli Ondalık Gösterim","DSnP2X"],["Devirli Ondalık Gösterimleri Eşleştir","UlZvteY"],["Kavramlar Yerli Yerinde","uMsPa6"],["Kesir Hesap Makinesi","UabOJFD"],["Efe'nin Odası","UsECYc3"]]},

{ay:"Ekim",brans:"Türkçe",ad:"Atatürk'ün Çocukluğu",sinif:5,sure:3,kod:"T.O.5.6 · T.O.5.22 · T.Y.5.15",
 pdf:PDF("697b52bad58600.27043492"),

 ozu:`<p>Metinde doğrudan verilen bilgileri bulma, “ve, ile, hem…hem de, ayrıca, hatta” gibi bağlantı ifadelerini doğru kullanma ve öğrencinin okur olarak güçlü/gelişmeye açık yönlerini fark etmesi.</p>`,
 dersler:[
 ["Metni okuma, Kelime Avı","Sınıftaki Atatürk köşesi üzerinden Atatürk'ün çocukluğuna dair sorular sorulur. Tahtada “Atatürk” içeriğinin ilk üç sayfasındaki görseller konuşulur. Öğretmen metni örnek olarak okur, sonra gönüllüler okur. Metnin yüzey anlamı için “Kelime Avı” oyunu EBA'dan paylaşılır ve cevaplar birlikte değerlendirilir."],
 ["Geçiş ve bağlantı ifadeleri","EBA'daki Geçiş ve Bağlantı İfadeleri içeriğinin etkinlikleri yapılır. “Atatürk” metnindeki bağlantı ifadeleri bulunur. “Doğru İfadeyi Bul” boşluk doldurma etkinliği yapılır (geri dönüşüm temalı paragraf). Öğrencilere bir sonraki derse hikâye kitabı getirmeleri söylenir, öz değerlendirme formunun kriterleri açıklanır."],
 ["Okuma süreci öz değerlendirme","Öğrenciler 10 dakika sessiz okuma yapar. Ardından çevrim içi Okuma Süreci Öz Değerlendirme Formu'nu doldurur: güçlü yönlerim, zorlandıklarım, alacağım önlemler, okur olarak hedefim. Öğretmen okur kimliğini geliştirme üzerine konuşarak bitirir."]],

{ay:"Ekim",brans:"Türkçe",ad:"Büyük Bağımsızlık Savaşı",sinif:6,sure:3,kod:"T.O.6.5 · T.Y.6.4 · T.Y.6.5",
 pdf:PDF("6ac52ed2ac0109.71085029"),
 ozet:"Büyük Taarruz ve Başkomutanlık Meydan Muharebesi metni üzerinden bilinmeyen kelimelerin anlamı tahmin edilir, ön bilgilerle yazı yazılır ve metne yazılı tepki verilir.",
 ozu:`<p>Anlamı bilinmeyen kelimeyi bağlamdan tahmin edip sözlükle doğrulama; ön bilgiden yararlanarak yazı planlama; okunan metne yorum, mektup, teşekkür yazısı veya röportaj biçiminde uygun yazılı tepki verme.</p>`,
 dersler:[
 ["Kelime ilişkilendirme ve okuma","Atatürk köşesi incelenir. Kelime İlişkilendirme Testi'nde “bağımsızlık, mücadele, zafer” için akla gelen kelimeler yazılır, cümle içinde kullanılır. “Büyük Taarruz ve Başkomutan Meydan Muharebesi” metni önce öğretmen, sonra öğrenciler tarafından okunur. Bilinmeyen kelimeler tahtaya yazılır, anlamları tahmin edilip TDK Güncel Türkçe Sözlük'ten kontrol edilir. Ödev: EBA'dan Tanılayıcı Dallanmış Ağaç."],
 ["Ön bilgiyle yazma","“Yazımı Yapılandırıyorum” beyin fırtınasıyla her öğrenci bir yazma amacı ve konusu belirler. “Kelime ve Kavram Havuzum” zihin haritası sınıfça oluşturulur. Öğrenciler havuzdan en az beş kavram kullanarak yazılarını ders sonuna kadar tamamlar. Ders sonrası öz değerlendirme formu gönderilir."],
 ["Metne yazılı tepki","Metin yeniden okunur, “Metni Anlama Haritası” sınıfça doldurulur (bilgi, kişi, olay, durum). Sınıf dört gruba ayrılır; her grup farklı bir tepki yazar: yorum paragrafı, kısa mektup, teşekkür yazısı, karakterlerden biriyle hayalî röportaj. Yazılar sınıfta okunur ve geri bildirim verilir."]],

{ay:"Ekim",brans:"Fen Bilimleri",ad:"Hareketli Komşularımız",sinif:5,sure:4,kod:"FB.5.1.4",
 pdf:PDF("6ac35a10a31836.41631637"),
 ozet:"Öğrenciler Güneş, Dünya ve Ay'ın büyüklüklerini ve birbirlerine göre hareketlerini simülasyonlarla inceler, gruplar hâlinde fiziksel model yapar, araştırıp modelini geliştirir.",
 ozu:`<p>Güneş, Dünya ve Ay'ın hacimsel büyüklük oranları ve hareketleri (Dünya'nın kendi ekseni ve Güneş etrafında, Ay'ın Dünya etrafında dönmesi) bilimsel bir modelle temsil edilir; model, araştırılan gerçek verilere göre düzeltilir.</p>`,
 dersler:[
 ["Gökyüzü ve büyüklükler","Ders öncesi “Göğe Bakalım” dijital panosuna öğrenciler ön bilgilerini yazar. Derste “Gece ve gündüz gökyüzünde neler görürsünüz?” sorularıyla başlanır, panodaki cevaplar okunur. EBA'daki Güneş, Dünya ve Ay etkileşimli içeriğinde büyüklükler karşılaştırılır. Yer Çekimi ve Yörüngeler simülasyonunda gerçek boyut ve uzaklık oranları incelenir. Ödev: EBA içeriği."],
 ["Fiziksel model yapımı","5'erli gruplar strafor top, oyun hamuru, pipet, iplik vb. ile Güneş, Dünya ve Ay'ın büyüklük oranlarını ve hareketlerini gösteren bir model yapar; hacim kavramı vurgulanır. Gruplar planlarını öğretmene gösterip geri bildirim alır, eksen eğikliğini de ekler ve hareketleri canlandırmayı prova eder. Ödev: sunum şablonu ve kavram haritası."],
 ["Araştır, sun, geliştir","Gruplar “En çok neye şaşırdınız?” sorusuyla başlar. Güneş, Dünya ve Ay'ın gerçek boyut ve uzaklıklarını bilimsel kaynaklardan araştırır, sunumlarını sınıfa yapar. Verileri kendi modelleri ve diğer grupların modelleriyle karşılaştırıp ölçek hatalarını bulur, modeli yeniden geliştirip değişiklikleri gerekçesiyle anlatır."],

];

const AYLAR = ["Ekim"];
const st = {ay: AYLAR[AYLAR.length-1], brans: "Tümü"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function chips(el, items, key){
  el.querySelectorAll("button").forEach(b => b.remove());
  items.forEach(v => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = v;
    b.setAttribute("aria-pressed", st[key] === v);
    b.onclick = () => { st[key] = v; if (key === "ay") st.brans = "Tümü"; render(); };
    el.appendChild(b);
  });
}

function card(s){
  return `<article class="card">
  <div class="meta"><span class="tag b">${esc(s.brans)}</span><span class="tag">${s.sinif}. sınıf</span><span class="tag">${s.sure} ders saati</span><span class="tag">${esc(s.kod)}</span></div>
  <h2>${esc(s.ad)}</h2>
  <p class="lead">${esc(s.ozet)}</p>
  <h3>Konunun özü</h3><div class="ozu">${s.ozu}</div>
  <h3>Ders ders akış</h3>
  <ol class="ders">${s.dersler.map((d,i)=>`<li><b>${i+1}. ders: ${esc(d[0])}</b>${esc(d[1])}</li>`).join("")}</ol>
  <h3>Gerekenler</h3><p class="need">${esc(s.gerek)}</p>
  <details><summary>Bağlantılar (${s.link.length})</summary><ul>${s.link.map(l=>`<li><a href="https://meb.ai/${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a></li>`).join("")}</ul></details>
  <a class="pdf" href="${s.pdf}" target="_blank" rel="noopener">📄 Senaryonun PDF'ini aç</a>
  </article>`;
}

function render(){
  const ayList = S.filter(s => s.ay === st.ay);
  const branslar = ["Tümü", ...new Set(ayList.map(s => s.brans))];
  chips(document.getElementById("aylar"), AYLAR, "ay");
  chips(document.getElementById("branslar"), branslar, "brans");
  const list = ayList.filter(s => st.brans === "Tümü" || s.brans === st.brans);
  document.getElementById("liste").innerHTML = list.length ? list.map(card).join("") : `<p class="empty">Bu ay için senaryo yok.</p>`;
}
render();
</script>
